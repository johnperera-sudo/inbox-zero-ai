workflows:
  ios-workflow:
    name: iOS Free Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build iOS
        script: |
          xcodebuild -project InboxZeroAI.xcodeproj -scheme InboxZeroAI -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
    artifacts:
      - build/**
